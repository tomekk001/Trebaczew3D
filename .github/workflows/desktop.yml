name: Wersje do pobrania (Windows, macOS, Android)
on:
  push:
    branches: [main]
    paths: ['desktop/**', 'mobile/**', '.github/workflows/desktop.yml']
  workflow_dispatch:
permissions:
  contents: write
env:
  TAG: desktop-v1.0.${{ github.run_number }}
  NAZWA: Wersje do pobrania 1.0.${{ github.run_number }}
  OPIS: Instalator na Windows (64-bit), obraz dysku na macOS i plik APK na Androida. Aplikacje pobierają aktualną wersję gry z trebaczew.io.
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Zależności
        working-directory: desktop
        run: npm install --no-audit --no-fund
      - name: Kopia gry do instalatora
        working-directory: desktop
        run: node prepare.js
      - name: Instalator
        working-directory: desktop
        run: npx electron-builder --win --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Wydanie
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ env.NAZWA }}
          body: ${{ env.OPIS }}
          files: desktop/dist/Trebaczew-Setup.exe
          make_latest: true
  macos:
    needs: windows
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Zależności
        working-directory: desktop
        run: npm install --no-audit --no-fund
      - name: Kopia gry
        working-directory: desktop
        run: node prepare.js
      - name: Obraz dysku
        working-directory: desktop
        run: npx electron-builder --mac --universal --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Wydanie
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: desktop/dist/Trebaczew-Mac.dmg
  android:
    needs: windows
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Projekt Androida
        working-directory: mobile
        run: |
          npm install --no-audit --no-fund
          npx cap add android
          sed -i 's/android:name=".MainActivity"/android:name=".MainActivity" android:screenOrientation="sensorLandscape"/' android/app/src/main/AndroidManifest.xml
          mkdir -p ~/.android && cp debug.keystore ~/.android/debug.keystore
          npx cap sync android
      - name: Ikona
        run: |
          for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do n=${d%%:*}; s=${d##*:}; for f in ic_launcher ic_launcher_round ic_launcher_foreground; do convert src/icon-512.png -resize ${s}x${s} mobile/android/app/src/main/res/mipmap-$n/$f.png || true; done; done
      - name: APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../Trebaczew-Android.apk
      - name: Wydanie
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: mobile/Trebaczew-Android.apk
