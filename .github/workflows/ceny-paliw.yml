name: Ceny paliw
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pobierz ceny
        run: python3 tools/ceny_paliw.py
      - name: Zapisz zmiany
        run: |
          if ! git diff --quiet ceny_paliw.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add ceny_paliw.json
            git commit -m "Aktualizacja cen paliw"
            git push
          fi
