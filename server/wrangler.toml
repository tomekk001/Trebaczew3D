name = "trebaczew-mp"
main = "src/index.js"
compatibility_date = "2025-09-01"
workers_dev = true

[assets]
directory = "./_private_stats"
binding = "ASSETS"
run_worker_first = true
html_handling = "none"

# modele językowe do rozmów z postaciami (Workers AI)
[ai]
binding = "AI"

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[durable_objects.bindings]]
name = "STATS"
class_name = "Stats"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Stats"]
