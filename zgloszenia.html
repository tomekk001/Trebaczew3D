<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zgłoszenia · Symulator życia w Trębaczewie</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="src/favicon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
:root{--ink:#f6f4ef;--muted:#b9c0c6;--dim:#7f878e;--accent:#f2c230;--line:rgba(255,255,255,.12)}
*{box-sizing:border-box} html,body{margin:0;background:#0b0d10;color:var(--ink);font-family:Barlow,'Segoe UI',Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:32px 16px 48px}
.kick{font-family:'Barlow Condensed',sans-serif;font-weight:700;letter-spacing:.3em;color:var(--accent);text-transform:uppercase;font-size:15px}
h1{font-family:Anton,Impact,sans-serif;font-weight:400;font-size:clamp(40px,8vw,64px);line-height:.95;margin:4px 0 14px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px;color:var(--muted);font-size:14px}
input,select{background:rgba(255,255,255,.07);color:var(--ink);border:1px solid var(--line);border-radius:3px;padding:9px 10px;font:inherit;font-size:15px}
button{background:var(--accent);color:#111;border:0;border-radius:3px;padding:9px 14px;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:16px;letter-spacing:.04em;text-transform:uppercase;cursor:pointer}
button.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}
.r{background:#121518;border:1px solid var(--line);border-left:4px solid var(--accent);padding:12px 14px;margin:10px 0}
.r .h{display:flex;justify-content:space-between;gap:8px;color:var(--dim);font-size:13px;flex-wrap:wrap}
.r .k{color:var(--accent);font-weight:600}
.r p{white-space:pre-wrap;word-break:break-word;margin:8px 0;line-height:1.45}
.r details{color:var(--dim);font-size:13px} .r pre{white-space:pre-wrap;word-break:break-word;font-size:12px}
.empty,.err{color:var(--muted);padding:20px 0} .err{color:#ffb3b5}
</style>
</head>
<body>
<main>
  <div class="kick">Symulator życia w Trębaczewie</div>
  <h1>ZGŁOSZENIA</h1>
  <div class="bar" id="login"><input id="key" type="password" placeholder="Klucz dostępu" autocomplete="off" size="28"><button id="go">Pokaż</button><span>Klucz dostałeś w czacie z Claude. Zapamiętamy go w tej przeglądarce.</span></div>
  <div class="bar" id="tools" hidden><select id="flt"><option value="">Wszystkie kategorie</option></select><button class="ghost" id="ref">Odśwież</button><button class="ghost" id="out">Wyloguj</button><span id="cnt"></span></div>
  <div id="list"></div>
</main>
<script>
const API='https://trebaczew-mp.kontakt-3e3.workers.dev';
const $=id=>document.getElementById(id); let KEY=''; let DATA=[];
try{ KEY=(location.hash.match(/k=([^&]+)/)||[])[1]||localStorage.getItem('treb-zgl')||''; if(location.hash) history.replaceState(null,'',location.pathname); }catch(e){}
const esc=t=>String(t||'').replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));
function render(){ const f=$('flt').value; const L=DATA.filter(r=>!f||r.kat===f); $('cnt').textContent=`${L.length} zgłoszeń`;
  $('list').innerHTML=L.length?L.map(r=>`<div class="r"><div class="h"><span class="k">${esc(r.kat)}</span><span>${new Date(r.t).toLocaleString('pl-PL')}</span></div><p>${esc(r.opis)}</p>${r.kontakt?`<div class="h">Kontakt: ${esc(r.kontakt)}</div>`:''}${r.info?`<details><summary>Informacje z gry</summary><pre>${esc(r.info)}</pre></details>`:''}<div style="margin-top:8px"><button class="ghost" data-del="${r.id}">Usuń</button></div></div>`).join(''):'<div class="empty">Brak zgłoszeń. 🎉</div>';
  document.querySelectorAll('[data-del]').forEach(b=>b.addEventListener('click',()=>load(b.dataset.del))); }
async function load(del){ if(!KEY)return; try{ const r=await fetch(`${API}/reports?k=${encodeURIComponent(KEY)}${del?'&del='+del:''}`,{cache:'no-store'}); if(r.status===403){ $('list').innerHTML='<div class="err">Zły klucz dostępu.</div>'; try{ localStorage.removeItem('treb-zgl'); }catch(e){} return; }
    DATA=await r.json(); try{ localStorage.setItem('treb-zgl',KEY); }catch(e){} $('login').hidden=true; $('tools').hidden=false;
    const cats=[...new Set(DATA.map(r=>r.kat))]; const cur=$('flt').value; $('flt').innerHTML='<option value="">Wszystkie kategorie</option>'+cats.map(c=>`<option ${c===cur?'selected':''}>${esc(c)}</option>`).join(''); render();
  }catch(e){ $('list').innerHTML='<div class="err">Nie udało się połączyć z serwerem gry.</div>'; } }
$('go').addEventListener('click',()=>{ KEY=$('key').value.trim(); load(); }); $('key').addEventListener('keydown',e=>{ if(e.key==='Enter'){ KEY=$('key').value.trim(); load(); } });
$('ref').addEventListener('click',()=>load()); $('flt').addEventListener('change',render); $('out').addEventListener('click',()=>{ try{ localStorage.removeItem('treb-zgl'); }catch(e){} location.reload(); });
if(KEY) load();
</script>
</body>
</html>
